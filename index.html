<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Simple Pong</h1>

    <div class="scoreboard">
      <div class="score player">
        <div class="label">Player</div>
        <div id="playerScore">0</div>
      </div>
      <div class="score computer">
        <div class="label">Computer</div>
        <div id="computerScore">0</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <div class="hint">Controls: Move mouse over canvas or use ArrowUp / ArrowDown</div>
    </div>

    <footer>
      Built with HTML, CSS, and JavaScript — left paddle: you; right paddle: computer
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
